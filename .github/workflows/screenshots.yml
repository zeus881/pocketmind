# Records the golden screenshots ON LINUX (the CI machine) and uploads them as an artifact.
# Fonts are rendered slightly differently on Windows, macOS and Linux, so the images CI compares
# against should come from CI itself. Run it from the Actions tab ("Run workflow"), download the
# "golden-screenshots" artifact and commit the PNGs into each module's src/test/screenshots/.
name: Record screenshots

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v6

      - name: Record
        run: ./gradlew recordRoborazziDebug

      - uses: actions/upload-artifact@v7
        with:
          name: golden-screenshots
          path: "**/src/test/screenshots/*.png"