# Release: pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) builds a
# SIGNED app bundle (for Google Play) and APK (for direct install) and attaches both to a
# GitHub Release.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of the release keystore file (`base64 -w0 pocketmind-release.jks`)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password
# The keystore is decoded into the runner's temp folder and never committed.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The Android/KMP Gradle build lives in mobile/ (V3 monorepo); artifact paths below stay repo-relative.
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v6

      - name: Quality gate (same checks as CI)
        run: ./gradlew spotlessCheck detekt lint testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocketmind-release.jks"
          echo "POCKETMIND_KEYSTORE_PATH=$RUNNER_TEMP/pocketmind-release.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        env:
          POCKETMIND_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          POCKETMIND_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          POCKETMIND_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # versionName/versionCode come from this tag (AppVersion in build-logic).
          POCKETMIND_VERSION_TAG: ${{ github.ref_name }}
        # --no-parallel: release KSP tasks once raced in parallel builds (PROGRESS.md, BLOCKERS).
        run: ./gradlew bundleRelease assembleRelease --no-parallel

      - name: Rename artifacts with the version
        run: |
          mkdir dist
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "dist/PocketMind-${GITHUB_REF_NAME}.aab"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/PocketMind-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v3
        with:
          files: mobile/dist/*
          generate_release_notes: true
