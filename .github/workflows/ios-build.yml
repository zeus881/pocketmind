# iOS build (V3): Kotlin/Native can only build Apple targets on macOS, and this PC is Windows, so
# every iOS check runs here. Unsigned simulator build: no Apple account or certificate is needed.
name: iOS build

on:
  push:
    branches: [main, v3]
    paths: ["mobile/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    # Apple-silicon runner: matches the iosSimulatorArm64 target.
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      # JDK 21 runs the JVM unit tests (Gradle toolchain); JDK 17 (listed last = default) runs Gradle.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v6

      - name: Shared code tests on the iOS simulator target
        run: >
          ./gradlew --continue :shared:core:iosSimulatorArm64Test :shared:data:iosSimulatorArm64Test
          :shared:tools:iosSimulatorArm64Test :shared:ai:iosSimulatorArm64Test

      # Failed iOS tests as annotations (visible on the run page without a login; full logs need one).
      - name: Report failed iOS tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("**/build/test-results/iosSimulatorArm64Test/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      text = (bad.get("message") or bad.text or "").strip().replace("\n", " ")[:600]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          EOF

      - name: Generate the Xcode project (XcodeGen)
        working-directory: mobile/iosApp
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      # The Kotlin framework on its own first: a Kotlin/Native error then shows up as this step's failure.
      - name: Link the shared Kotlin framework (simulator, arm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      # ARCHS=arm64: a "generic" simulator build would also ask for x86_64, which the shared code doesn't
      # target (Apple-silicon simulators only). Xcode's errors are copied into annotations, which GitHub shows
      # on the run page without a login (full logs need one).
      - name: Build the iOS app for the simulator
        working-directory: mobile/iosApp
        run: |
          set -o pipefail
          if ! xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
              -sdk iphonesimulator -destination "generic/platform=iOS Simulator" ARCHS=arm64 \
              CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"; then
            grep -E "error:|What went wrong|FAILURE|\*\* BUILD FAILED" -A2 "$RUNNER_TEMP/xcodebuild.log" \
              | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-reports
          path: mobile/**/build/reports/
          retention-days: 7
