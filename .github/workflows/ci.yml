# Continuous Integration: every push and pull request must pass formatting, static analysis,
# Android Lint, unit tests and a debug build. A red CI blocks the merge.
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

# Cancel an older run of the same branch when a newer commit arrives (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # JDK 21 runs the unit tests (Gradle toolchain); JDK 17 (listed last = default) runs Gradle.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17

      # Caches Gradle downloads and build outputs between CI runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Formatting and static analysis
        run: ./gradlew spotlessCheck detekt

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests and coverage gate
        run: ./gradlew testDebugUnitTest koverVerifyApp koverXmlReportApp koverHtmlReportApp

      # Coverage summary on the run page (no third-party action: parses Kover's JaCoCo-format XML).
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, os
          path = "build/reports/kover/reportApp.xml"
          if not os.path.exists(path):
              print("No coverage report was produced."); raise SystemExit
          root = ET.parse(path).getroot()
          line = next(c for c in root.findall("counter") if c.get("type") == "LINE")
          missed, covered = int(line.get("missed")), int(line.get("covered"))
          print(f"### Line coverage: {100 * covered / (missed + covered):.1f} % ({covered}/{missed + covered} lines)")
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: build/reports/kover/
      # Screenshot tests: re-render every screen and compare with the committed golden images
      # (src/test/screenshots). A visual change fails CI until the images are re-recorded.
      - name: Screenshot tests
        run: ./gradlew verifyRoborazziDebug

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-diffs
          path: "**/build/outputs/roborazzi/"
          retention-days: 7

      - name: Debug build
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7
