# Single place for every dependency version in PocketMind.
# All versions were checked against Google Maven / Maven Central / Gradle Plugin Portal
# on 2026-11-01 and are pinned (no "+" or "latest.release").

[versions]
# Build tooling
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
spotless = "8.10.4"
ktlint = "1.8.0"
detekt = "1.23.8"
aboutlibraries = "15.3.0"
kover = "0.9.11"
play-app-update = "2.1.0"
play-review = "2.0.2"
play-billing = "9.1.0"
gradle-play-publisher = "4.1.1"

# Android SDK levels (plain numbers, read by the convention plugins)
compileSdk = "37"
targetSdk = "36"
minSdk = "26"
# JDK that RUNS the JVM unit tests (Robolectric's Android 35+ images and some libraries,
# e.g. the Markdown renderer, need Java 21). Code is still compiled to Java 17 bytecode.
testJdk = "21"

# AndroidX
androidx-core = "1.19.1"
androidx-activity = "1.13.0"
androidx-exifinterface = "1.4.2"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.10.2"
androidx-room = "2.8.5"
# The SQLite driver library Room 2.8.5 requires (2.6.2, from its Gradle module metadata); the bundled
# driver is what Room uses on iOS (V3).
androidx-sqlite = "2.6.2"
sqlcipher = "4.20.0"
androidx-datastore = "1.3.0"
androidx-work = "2.12.0"
androidx-biometric = "1.1.0"
androidx-fragment = "1.9.1"
androidx-profileinstaller = "1.4.1"
androidx-benchmark = "1.5.0"
androidx-test-core = "1.7.0"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-uiautomator = "2.4.0"
compose-bom = "2026.09.00"
# V3: Compose Multiplatform (shared Android + iOS UI). Checked on Maven Central 2026-11-10; it is built on
# AndroidX Compose 1.12.1 and supports iOS 14+. Its Material 3 has its own version line.
compose-multiplatform = "1.12.2"
compose-multiplatform-material3 = "1.9.0"
# The last JetBrains material-icons release (Maven Central, 2026-11-10); on Android it resolves to AndroidX icons.
compose-multiplatform-icons = "1.7.3"
# JetBrains' multiplatform builds of AndroidX lifecycle and navigation (Maven Central, 2026-11-11). On Android their
# artifacts depend on androidx.lifecycle 2.11.0 / androidx.navigation 2.10.0, i.e. the same classes the app uses.
jb-lifecycle = "2.11.0"
jb-navigation = "2.10.0"
# Icons were frozen at 1.7.8 and removed from the Compose BOM, so they are pinned separately.
compose-material-icons = "1.7.8"

# DI / async / serialization
# V3: Koin (Apache-2.0) replaces Hilt: dependency injection that works on Android and iOS.
koin = "4.2.2"
coroutines = "1.11.0"
serialization = "1.12.0"
# V3 shared tools: dates and exact decimals on iOS too (checked on Maven Central 2026-11-10; bignum is Apache-2.0).
kotlinx-datetime = "0.8.0"
bignum = "0.3.10"

# Runtime libraries
litertlm = "0.19.0"
okhttp = "5.5.1"
timber = "5.0.1"
pdfbox-android = "2.0.27.0"
markdown-renderer = "0.46.0"
leakcanary = "2.14"
# Latest STABLE Glance (1.3 is alpha).
glance = "1.2.0"

# Testing
junit = "4.13.2"
mockk = "1.14.11"
turbine = "1.2.1"
robolectric = "4.17"
roborazzi = "1.77.0"

[libraries]
# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "androidx-navigation" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "androidx-room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
# The multiplatform part of DataStore Preferences (Android, iOS, JVM): what shared code compiles against.
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "androidx-datastore" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }
androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }

# Compose (versions come from the BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# Adaptive layouts (versions from the Compose BOM): bottom bar / rail / drawer by window size,
# and window size classes for two-pane layouts.
compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-material-icons" }

# DI / async / serialization
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-androidx-workmanager = { module = "io.insert-koin:koin-androidx-workmanager", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# V3 shared (Kotlin Multiplatform) libraries
jb-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
jb-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
jb-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
jb-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-multiplatform-material3" }
jb-compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-multiplatform-icons" }
jb-compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
jb-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jb-lifecycle" }
jb-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jb-lifecycle" }
jb-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jb-navigation" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "bignum" }

# Runtime libraries
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox-android" }
# V3: the multiplatform coordinate (Android + iOS variants checked); v2 used the -android artifact directly.
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlibraries" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

# Gradle plugins used inside build-logic (as code dependencies, not applied plugins)
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
room-gradle-plugin = { module = "androidx.room:room-gradle-plugin", version.ref = "androidx-room" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "play-app-update" }
play-review-ktx = { module = "com.google.android.play:review-ktx", version.ref = "play-review" }
play-billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "play-billing" }
roborazzi-gradle-plugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# AGP 9: Kotlin Multiplatform modules with an Android target use this plugin (not com.android.library).
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "androidx-room" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-benchmark" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
play-publisher = { id = "com.github.triplet.play", version.ref = "gradle-play-publisher" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# Our own convention plugins (defined in build-logic/convention)
pocketmind-android-application = { id = "pocketmind.android.application" }
pocketmind-android-library = { id = "pocketmind.android.library" }
pocketmind-android-feature = { id = "pocketmind.android.feature" }
pocketmind-android-compose = { id = "pocketmind.android.compose" }
pocketmind-android-room = { id = "pocketmind.android.room" }
pocketmind-kmp-library = { id = "pocketmind.kmp.library" }
pocketmind-kmp-android-library = { id = "pocketmind.kmp.android.library" }
pocketmind-kmp-room = { id = "pocketmind.kmp.room" }
pocketmind-kmp-compose = { id = "pocketmind.kmp.compose" }
pocketmind-kmp-feature = { id = "pocketmind.kmp.feature" }
