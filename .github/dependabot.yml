# Dependabot: weekly pull requests for outdated Gradle dependencies and GitHub Actions.
# Each PR runs the full CI (lint, tests, coverage gate, build), so an update that breaks
# anything cannot be merged by accident.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Libraries released together are updated together (one PR instead of many).
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      test:
        patterns: ["junit*", "io.mockk*", "app.cash.turbine*", "org.robolectric*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"