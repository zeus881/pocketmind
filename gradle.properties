# Gradle daemon memory. Compose + R8 + many modules need a generous heap.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
# Build independent modules at the same time and reuse outputs from earlier builds.
# OFF (v2 phase 20): KSP intermittently ran with an incomplete classpath in parallel builds ("Context could
# not be resolved"), even after its outputs stopped being cached. Serial builds never showed it. See PROGRESS.md.
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
# Each module gets its own R class with only its own resources (smaller, faster builds).
android.nonTransitiveRClass=true
kotlin.code.style=official

# Configuration cache: Gradle saves the result of the configuration phase and reuses it when no
# build script changed, so repeated builds start much faster.
org.gradle.configuration-cache=true

# KSP incremental processing is OFF: with Hilt it intermittently dropped generated files
# (e.g. data:models lost its Hilt module wrapper -> MissingBinding in :app) and caused
# 'could not be resolved' errors. A full KSP pass per changed module costs seconds;
# a wrong build costs much more. See docs/learn/v2-phase-2.md.
ksp.incremental=false
# Processor classloader cache back ON (v2 phase 20). It was off because Hilt's static state leaked between KSP
# tasks running in PARALLEL; builds are serial now, and a fresh classloader per task filled the daemon's
# metaspace ("Cannot find required type element java.lang.Class").
ksp.classloader.cache.processors=true

# Memory budget for a 16 GB laptop: at most 6 parallel workers (each Robolectric test JVM
# can take ~1 GB) and a 2 GB Kotlin compile daemon. With 12 workers the build ran out of RAM,
# started swapping and stalled for over an hour (v2 phases 8-9).
org.gradle.workers.max=6
kotlin.daemon.jvmargs=-Xmx2g
